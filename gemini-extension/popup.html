<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --primary: #8e2de2;
      --secondary: #4a00e0;
      --bg: #0f0c20;
      --card: rgba(255, 255, 255, 0.05);
      --text: #ffffff;
      --text-muted: #a0aec0;
      --success: #10b981;
      --danger: #ef4444;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f0c20 0%, #15102a 100%);
      color: var(--text);
      width: 320px;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-img {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      box-shadow: 0 0 12px var(--primary);
    }

    h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #ffffff, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(10px);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-label {
      color: var(--text-muted);
      font-size: 13px;
    }

    .status-value {
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .badge.connected {
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .badge.disconnected {
      background-color: var(--danger);
      box-shadow: 0 0 8px var(--danger);
    }

    .btn-sync {
      background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(142, 45, 226, 0.3);
    }

    .btn-sync:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(142, 45, 226, 0.55);
    }

    .btn-sync:active {
      transform: translateY(1px);
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-copy {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
    }

    .btn-copy:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .btn-copy:active {
      transform: translateY(1px);
    }

    .btn-copy.success {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--success);
      color: #34d399;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
    }

    .config-card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(10px);
    }

    .config-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-row input {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 6px 10px;
      color: #fff;
      font-size: 13px;
      font-family: monospace;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .input-row input:focus {
      border-color: var(--primary);
    }

    .btn-save {
      background: rgba(142, 45, 226, 0.3);
      border: 1px solid var(--primary);
      color: #fff;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-save:hover {
      background: var(--primary);
    }

    .btn-save.saved {
      background: rgba(16, 185, 129, 0.3);
      border-color: var(--success);
      color: #34d399;
    }

    .chips-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 10px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="icon.png" class="logo-img">
      <h2>Gemini Api Agent</h2>
    </div>

    <div class="status-card">
      <div class="status-row">
        <span class="status-label">Server Connection</span>
        <span class="status-value" id="conn-status">
          <span class="badge disconnected" id="status-badge"></span>
          <span id="status-text">Disconnected</span>
        </span>
      </div>
      <div class="status-row">
        <span class="status-label">Last Sync</span>
        <span class="status-value" id="last-sync" style="color: var(--text-muted);">Never</span>
      </div>
    </div>

    <!-- Server Host Config Section -->
    <div class="config-card">
      <div class="config-title">Target Server IP / Host</div>
      <div class="input-row">
        <input type="text" id="server-host-input" placeholder="127.0.0.1" spellcheck="false">
        <button id="save-host-btn" class="btn-save">Save</button>
      </div>
      <div class="chips-row">
        <span class="chip" data-ip="127.0.0.1">Localhost</span>
        <span class="chip" data-ip="192.168.1.34">Mac (LAN)</span>
        <span class="chip" data-ip="10.56.65.136">Mac (ZT)</span>
        <span class="chip" data-ip="10.56.65.169">K3s Master</span>
      </div>
    </div>

    <div class="button-group">
      <button class="btn-sync" id="sync-btn">Force Sync Cookies</button>
      <button class="btn-copy" id="copy-btn">📋 Copy Cookies</button>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
